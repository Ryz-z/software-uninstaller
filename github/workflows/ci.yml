name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 GTK4 / PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-gtk-4.0

      - name: 逻辑自检
        run: python3 tests/test_all.py

      - name: GTK API 静态校验
        run: python3 tests/test_gtk_api.py

      - name: 构建 deb（dpkg-deb 路径，无需 debhelper）
        run: |
          mkdir -p dist
          OUT_DIR="$PWD/dist" ./build.sh dpkg-deb

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb
